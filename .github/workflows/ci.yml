# CI — przy każdym pushu buduje panel i binarki na obie
# architektury oraz odpala statyczną analizę. Zielony znaczek =
# projekt na pewno się kompiluje.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Zbuduj panel WWW
        run: make web

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Analiza statyczna
        run: make vet

      - name: Binarki amd64 + arm64
        run: make build-all
