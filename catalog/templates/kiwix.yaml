id: kiwix
name: Kiwix
tagline: Wikipedia (i nie tylko) offline, bez internetu
image: ghcr.io/kiwix/kiwix-serve:latest
webPort: 8083
subdomain: wiki
ports:
  - host: 8083
    container: 8080
volumes:
  - name: data
    path: /data
    opis: pliki .zim (paczki treści — pobierz z library.kiwix.org)
# kiwix-serve wymaga wskazania plików; * obejmuje wszystkie .zim w /data
cmd: ["*.zim"]
hint: >-
  Kiwix startuje pusty — kliknij "dodaj treść" i wybierz paczkę
  (np. polską Wikipedię), a MalleusOS pobierze ją i uruchomi
  aplikację sam.
pliki:
  volume: data
  ext: .zim
  opis: paczki treści — więcej znajdziesz na library.kiwix.org (skopiuj link do pliku .zim)
  propozycje:
    - nazwa: Wikipedia PL bez zdjęć (~2 GB)
      url: https://download.kiwix.org/zim/wikipedia/wikipedia_pl_all_nopic.zim
    - nazwa: Wikipedia PL ze zdjęciami (duża, ~15 GB)
      url: https://download.kiwix.org/zim/wikipedia/wikipedia_pl_all_maxi.zim
