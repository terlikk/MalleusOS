id: pihole
name: Pi-hole
tagline: Koniec reklam w całej domowej sieci
image: pihole/pihole:latest
webPort: 8082
subdomain: dns
hint: >-
  Ostatni krok: w panelu routera ustaw serwer DNS na HOST —
  od tej chwili reklamy znikają na każdym urządzeniu w domu.
ports:
  - host: 8082
    container: 80
  - host: 53
    container: 53
  - host: 53
    container: 53
    protocol: udp
volumes:
  - name: etc
    path: /etc/pihole
    opis: konfiguracja i listy blokowania
env:
  - name: TZ
    value: Europe/Warsaw
    opis: strefa czasowa
  - name: WEBPASSWORD
    value: ""
    pytaj: true
    opis: ustaw hasło do panelu Pi-hole (będziesz nim się logować w zakładce Otwórz)
